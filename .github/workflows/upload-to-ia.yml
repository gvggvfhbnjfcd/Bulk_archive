name: Archive one day of tsumanne threads to IA

on:
  schedule:
    - cron: "30 18 * * *"   # daily, 18:30 UTC = 03:30 JST (the site's dates are assumed to be JST)
  workflow_dispatch: {}      # run manually from the Actions tab (e.g. to catch up)

permissions:
  contents: write   # needed to commit the state files

# One run at a time, so overlapping runs can't race on state files or git push.
concurrency:
  group: tsumanne-archive
  cancel-in-progress: false

env:
  START_DATE: "2026-11-16"   # first day to archive; only used until state/next_date.txt exists
  LAG_DAYS: "1"              # only archive days at least this many days old (1 = up to yesterday, JST)
  MAX_DAYS_PER_RUN: "1"      # raise temporarily to catch up on a backlog (e.g. 7)

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests internetarchive

      # For each day: build one bundle (si_<date>.zip + si_<date>.txt manifest),
      # upload it, then advance state/next_date.txt.
      # The date only advances after a successful upload, so a failure (exit 1:
      # listing page error, exit 2: transient zip error) retries the same day
      # on the next run. Zips the server reports as 404/410 don't fail the run;
      # they're recorded in state/failed_ids.txt and skipped from then on.
      - name: Archive day(s)
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
        run: |
          mkdir -p state downloads
          TODAY=$(TZ=Asia/Tokyo date +%F)
          LATEST=$(date -d "$TODAY - $LAG_DAYS days" +%F)
          echo "Today (JST): $TODAY — newest archivable day: $LATEST"

          for i in $(seq 1 "$MAX_DAYS_PER_RUN"); do
            if [ -f state/next_date.txt ]; then DAY=$(cat state/next_date.txt); else DAY="$START_DATE"; fi

            if [[ "$DAY" > "$LATEST" ]]; then
              echo "Next day to archive ($DAY) isn't old enough yet; nothing to do."
              break
            fi

            echo "=== Archiving $DAY ==="
            python download_zips.py \
              --base "https://tsumanne.net/si/all" \
              --date "$DAY" \
              --out downloads

            echo "Files: $(ls downloads | wc -l)"; du -sh downloads

            # A day with nothing new produces no bundle.
            if ls downloads/si_*.zip >/dev/null 2>&1; then
              python upload_to_ia.py \
                --dir downloads \
                --identifier "tsumanne-si-archive" \
                --title "「」ッチー" \
                --collection opensource_media \
                --source "https://tsumanne.net/si/"
            else
              echo "No new threads for $DAY; nothing to upload."
            fi

            rm -rf downloads/*
            date -d "$DAY + 1 day" +%F > state/next_date.txt
            echo "Next day to archive: $(cat state/next_date.txt)"
          done

      # Debug aid only — keeps a partial bundle from a failed run.
      - name: Upload staging folder as build artifact (debug)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tsumanne-partial-${{ github.run_id }}
          path: downloads/
          if-no-files-found: ignore
          retention-days: 14

      # always(): keep progress from days that finished before a later day failed.
      - name: Commit updated state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in state/next_date.txt state/failed_ids.txt; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --cached --quiet || git commit -m "Archive progress: next day $(cat state/next_date.txt 2>/dev/null || echo n/a)"
          git push
