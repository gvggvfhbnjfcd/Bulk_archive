name: Upload folder from Backblaze B2 to Internet Archive

on:
  workflow_dispatch:
    inputs:
      item:
        description: "Internet Archive item identifier"
        required: true
        default: "futaba-bulk-archive"
      b2_bucket:
        description: "Backblaze B2 bucket name"
        required: true
      b2_prefix:
        description: "Server folder in the bucket (e.g. may). Leave empty for the whole bucket."
        required: false
        default: ""
      make_zip:
        description: "Upload as one big zip instead of individual files"
        type: boolean
        required: true
        default: true

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install b2 internetarchive

      - name: Download from Backblaze B2
        env:
          B2_APPLICATION_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          BUCKET: ${{ inputs.b2_bucket }}
          PREFIX: ${{ inputs.b2_prefix }}
        run: |
          PREFIX="${PREFIX#/}"
          PREFIX="${PREFIX%/}"
          if [ -n "$PREFIX" ]; then
            SRC="b2://${BUCKET}/${PREFIX}"
          else
            SRC="b2://${BUCKET}"
          fi
          mkdir -p "$RUNNER_TEMP/archive"
          b2 sync --threads 8 "$SRC" "$RUNNER_TEMP/archive"
          echo "Downloaded files:"
          find "$RUNNER_TEMP/archive" -type f | wc -l
          du -sh "$RUNNER_TEMP/archive"
          df -h "$RUNNER_TEMP"

      - name: Zip folder
        if: ${{ inputs.make_zip }}
        env:
          ITEM: ${{ inputs.item }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cd "$RUNNER_TEMP/archive"
          # -0 = store only (no compression): faster, and the files are already compressed
          zip -r -0 -q "$RUNNER_TEMP/out/${ITEM}.zip" .
          rm -rf "$RUNNER_TEMP/archive"
          ls -lh "$RUNNER_TEMP/out"
          df -h "$RUNNER_TEMP"

      - name: Upload to Internet Archive
        env:
          IA_ACCESS_KEY_ID: ${{ secrets.IA_ACCESS_KEY_ID }}
          IA_SECRET_ACCESS_KEY: ${{ secrets.IA_SECRET_ACCESS_KEY }}
          ITEM: ${{ inputs.item }}
          MAKE_ZIP: ${{ inputs.make_zip }}
        run: |
          if [ "$MAKE_ZIP" = "true" ]; then
            SRC="$RUNNER_TEMP/out/${ITEM}.zip"
          else
            SRC="$RUNNER_TEMP/archive"
          fi
          ia upload "$ITEM" "$SRC" \
            --metadata="description:futaba bulk thread archive" \
            --checksum \
            --retries 5
