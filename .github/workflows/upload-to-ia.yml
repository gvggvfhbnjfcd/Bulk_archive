name: Upload folder from Backblaze B2 to Internet Archive

on:
  workflow_dispatch:
    inputs:
      item:
        description: "Internet Archive item identifier"
        required: true
        default: "futaba-bulk-archive"
      b2_bucket:
        description: "Backblaze B2 bucket name"
        required: true
      b2_prefix:
        description: "Folder (prefix) inside the bucket, e.g. zicos"
        required: true
        default: "zicos"

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo (for upload_folder.py)
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install b2
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install internetarchive
          fi

      - name: Download folder from Backblaze B2
        env:
          B2_APPLICATION_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/zicos"
          b2 sync --threads 8 \
            "b2://${{ inputs.b2_bucket }}/${{ inputs.b2_prefix }}" \
            "$RUNNER_TEMP/zicos"
          echo "Downloaded files:"
          find "$RUNNER_TEMP/zicos" -type f | wc -l
          du -sh "$RUNNER_TEMP/zicos"

      - name: Upload folder to Internet Archive
        working-directory: getuploader_downloader_py
        env:
          IA_ACCESS_KEY_ID: ${{ secrets.IA_ACCESS_KEY_ID }}
          IA_SECRET_ACCESS_KEY: ${{ secrets.IA_SECRET_ACCESS_KEY }}
        run: |
          python upload_folder.py \
            --item "${{ inputs.item }}" \
            --folder "$RUNNER_TEMP/zicos"

      - name: Set item description
        env:
          IA_ACCESS_KEY_ID: ${{ secrets.IA_ACCESS_KEY_ID }}
          IA_SECRET_ACCESS_KEY: ${{ secrets.IA_SECRET_ACCESS_KEY }}
        run: |
          ia metadata "${{ inputs.item }}" \
            --modify="description:futaba bulk thread archive"
